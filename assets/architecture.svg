<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Continual Outreach architecture</title><desc id="desc">Interview once, run a qualified outreach batch, observe outcomes, and tune the next batch. Any agent executes the workflow with authenticated tools. A scheduler wakes it and a ledger gates each send.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#818cf8" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="740" rx="24" fill="#0f172a"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<text x="48" y="51" fill="#a5b4fc" font-size="13" font-weight="700" letter-spacing="2">CONTINUAL OUTREACH</text>
<text x="48" y="88" fill="#f8fafc" font-size="29" font-weight="700">Your agent. A repeatable learning loop.</text>
<text x="48" y="118" fill="#94a3b8" font-size="16">Set direction once. Improve who you reach with evidence from each batch.</text>

<rect x="48" y="155" width="310" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
<text x="68" y="187" fill="#f8fafc" font-size="18" font-weight="600">01  Fork + open your agent</text>
<text x="68" y="213" fill="#cbd5e1" font-size="14">Codex, Claude Code or another agent</text>
<text x="68" y="236" fill="#cbd5e1" font-size="14">Shared Markdown instructions</text>
<rect x="406" y="155" width="360" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
<text x="426" y="187" fill="#f8fafc" font-size="18" font-weight="600">02  Interview + configure</text>
<text x="426" y="213" fill="#cbd5e1" font-size="14">ICP · channel · message · authorization</text>
<text x="426" y="236" fill="#cbd5e1" font-size="14">Export destination · success criteria</text>
<rect x="814" y="155" width="338" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
<text x="834" y="187" fill="#f8fafc" font-size="18" font-weight="600">Scheduler</text>
<text x="834" y="213" fill="#cbd5e1" font-size="14">Cron or your agent app</text>
<text x="834" y="236" fill="#cbd5e1" font-size="14">Wakes the configured agent</text>
<path d="M358 205 H398" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M586 255 V276 H30 V389 H40" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M983 255 V276 H586" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="305" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="2">EACH BATCH · CURRENT AGENT + COMPUTER USE</text>
<rect x="48" y="335" width="240" height="108" rx="12" fill="#1e293b" stroke="#334155"/>
<text x="68" y="367" fill="#f8fafc" font-size="18" font-weight="600">Research + draft</text>
<text x="68" y="393" fill="#cbd5e1" font-size="12">Browse sources; verify ownership</text>
<text x="68" y="416" fill="#cbd5e1" font-size="12">Qualify and personalize drafts</text>
<rect x="336" y="335" width="240" height="108" rx="12" fill="#1e293b" stroke="#334155"/>
<text x="356" y="367" fill="#f8fafc" font-size="18" font-weight="600">Check + send</text>
<text x="356" y="393" fill="#cbd5e1" font-size="12">Ledger gates each attempt</text>
<text x="356" y="416" fill="#cbd5e1" font-size="12">Verify the result in the channel</text>
<rect x="624" y="335" width="240" height="108" rx="12" fill="#1e293b" stroke="#334155"/>
<text x="644" y="367" fill="#f8fafc" font-size="18" font-weight="600">Track + observe</text>
<text x="644" y="393" fill="#cbd5e1" font-size="12">Export every send or skip</text>
<text x="644" y="416" fill="#cbd5e1" font-size="12">Collect comparable outcomes</text>
<rect x="912" y="335" width="240" height="108" rx="12" fill="#25264b" stroke="#818cf8"/>
<text x="932" y="367" fill="#f8fafc" font-size="18" font-weight="600">Audit + tune</text>
<text x="932" y="393" fill="#cbd5e1" font-size="12">Learn from useful responses</text>
<text x="932" y="416" fill="#cbd5e1" font-size="12">Keep room for exploration</text>
<path d="M288 389 H328" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M576 389 H616" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M864 389 H904" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1032 443 V498 H168 V451" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#purple)"/>
<rect x="357" y="483" width="480" height="30" rx="15" fill="#25264b"/><text x="597" y="503" text-anchor="middle" fill="#c7d2fe" font-size="14">Next batch: guided selection + exploration</text>
<rect x="48" y="550" width="528" height="132" rx="12" fill="#1e293b" stroke="#334155"/>
<text x="68" y="582" fill="#f8fafc" font-size="18" font-weight="600">Private campaign state</text>
<text x="68" y="608" fill="#cbd5e1" font-size="14">ICP, prospects, messages, replies, audits and run logs</text>
<text x="68" y="631" fill="#cbd5e1" font-size="14">Local ledger: duplicates · quotas · unresolved sends · holds</text>
<text x="68" y="654" fill="#cbd5e1" font-size="14">Ignored by Git; back up privately</text>
<rect x="624" y="550" width="528" height="132" rx="12" fill="#1e293b" stroke="#334155"/>
<text x="644" y="582" fill="#f8fafc" font-size="18" font-weight="600">Operational boundary</text>
<text x="644" y="608" fill="#cbd5e1" font-size="14">Agent owns research, browser actions and connectors</text>
<text x="644" y="631" fill="#cbd5e1" font-size="14">Scripts own local gates, selection, locking and timeouts</text>
<text x="644" y="654" fill="#cbd5e1" font-size="14">Missing access or uncertain sends → checkpoint and pause</text>
<text x="48" y="716" fill="#94a3b8" font-size="13">Sending pauses are learning time. Scheduling never bypasses authorization or platform restrictions.</text></g></svg>